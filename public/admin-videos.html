<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kelola Video — Vidpas Admin</title><link rel="stylesheet" href="/styles.css"><link rel="stylesheet" href="/admin.css"><link rel="stylesheet" href="/admin-videos.css"></head><body><main class="shell admin-shell"><a class="brand" href="/">Vidpas</a><section class="panel composer admin-section" style="margin-top:28px"><div class="eyebrow">CONTROL CENTER</div><h1>Kelola Embed Video</h1><nav class="admin-nav"><a href="/admin">Dashboard</a><a href="/admin/videos">Embed Video</a><a href="/admin#posterManager">Poster Link</a><a href="/admin#settingsManager">Pengaturan</a><a href="/admin#adsManager">Iklan</a></nav><div id="adminVideoLogin"><p class="hero-copy">Masuk untuk mengelola video.</p><form id="videoLoginForm"><label>Password admin<input id="videoAdminPassword" type="password" required autocomplete="current-password"></label><button class="button primary">Login</button><div id="videoLoginStatus" class="status"></div></form></div><div id="adminVideoApp" class="hidden"><p class="fineprint">Video yang diterbitkan dari sini akan otomatis tampil di halaman Semua Video dan memiliki halaman embed tersendiri.</p><form id="videoForm"><label>Judul video<input id="videoTitle" maxlength="160" required></label><label>Deskripsi<textarea id="videoDescription" rows="3"></textarea></label><label>URL embed video<input id="videoEmbed" type="url" placeholder="https://..." required></label><label>URL thumbnail<input id="videoThumbnail" type="url" placeholder="https://... (opsional)"></label><div class="form-grid"><label>Orientasi<select id="videoOrientation"><option value="horizontal">Horizontal (16:9)</option><option value="vertical">Vertical (9:16)</option></select></label><label>Link download<input id="videoDownload" type="url" placeholder="https://... (opsional)"></label></div><fieldset class="task-field"><legend>Sub to Unlock (opsional)</legend><div class="form-grid"><label><input type="checkbox" class="unlock-kind" value="youtube"> Subscribe YouTube</label><label><input type="checkbox" class="unlock-kind" value="facebook"> Ikuti / gabung Facebook</label><label><input type="checkbox" class="unlock-kind" value="whatsapp"> Join saluran WhatsApp</label><label><input type="checkbox" class="unlock-kind" value="telegram"> Join grup Telegram</label></div><div id="unlockUrls" class="stack"></div></fieldset><button class="button primary">Publish Video</button><div id="videoStatus" class="status"></div><div id="videoCreated" class="result-box hidden"></div></form><h2>Video yang diterbitkan</h2><div id="videoList" class="paste-grid"></div><button id="videoLogout" class="button secondary">Logout</button></div></section></main><script src="/admin-videos.js" type="module"></script></body></html>
