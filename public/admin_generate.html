<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vidpas Admin Password Hash Generator</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f6fb;color:#172033;font:16px system-ui,-apple-system,Segoe UI,sans-serif;padding:24px}
main{max-width:560px;margin:5vh auto;background:#fff;border:1px solid #e5e9f2;border-radius:20px;padding:24px;box-shadow:0 18px 50px #17203312}
h1{font-size:22px;margin:0 0 8px}p{color:#64748b;line-height:1.55}label{display:block;font-weight:650;margin:18px 0 8px}
input{width:100%;padding:13px;border:1px solid #d8deea;border-radius:10px;font:inherit}
button{border:0;border-radius:10px;padding:13px 16px;font-weight:700;cursor:pointer;background:#245be8;color:white;margin-top:16px;width:100%}
output{display:block;overflow-wrap:anywhere;background:#f1f5f9;border-radius:10px;padding:14px;margin-top:12px;min-height:48px;font:13px ui-monospace,monospace}
small{color:#64748b}.ok{color:#087443}
</style>
</head>
<body><main>
<h1>Vidpas — Generator Hash Admin</h1>
<p>Alat ini berjalan sepenuhnya di browser perangkatmu. Password tidak dikirim ke server atau internet.</p>
<label for="pw">Password admin baru</label>
<input id="pw" type="password" autocomplete="new-password" placeholder="Masukkan password baru">
<label for="confirm">Ulangi password</label>
<input id="confirm" type="password" autocomplete="new-password" placeholder="Ulangi password">
<button id="make">Buat ADMIN_PASSWORD_HASH</button>
<p id="status" role="status"></p>
<label>Hasil untuk Cloudflare (salt:hash)</label>
<output id="result"></output>
<button id="copy" type="button" style="background:#172033">Salin hasil</button>
<p><small>Algoritma sesuai kode Vidpas: PBKDF2 · SHA-256 · 150.000 iterasi · 256-bit · Base64URL tanpa padding.</small></p>
</main>
<script>
const $=id=>document.getElementById(id);
function b64url(bytes){let s='';for(const b of new Uint8Array(bytes))s+=String.fromCharCode(b);return btoa(s).replaceAll('+','-').replaceAll('/','_').replaceAll('=','')}
$('make').onclick=async()=>{
 const pw=$('pw').value, confirm=$('confirm').value;
 $('result').textContent=''; $('status').textContent='';
 if(pw.length<12){$('status').textContent='Gunakan password minimal 12 karakter.';return}
 if(pw!==confirm){$('status').textContent='Password tidak sama.';return}
 try{
  const saltBytes=crypto.getRandomValues(new Uint8Array(18));
  const salt=b64url(saltBytes);
  const material=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveBits']);
  const bits=await crypto.subtle.deriveBits({name:'PBKDF2',salt:new TextEncoder().encode(salt),iterations:150000,hash:'SHA-256'},material,256);
  $('result').textContent=salt+':'+b64url(bits);
  $('status').textContent='Berhasil. Salin hasil di atas ke Cloudflare.';$('status').className='ok';
  $('pw').value='';$('confirm').value='';
 }catch(e){$('status').textContent='Browser tidak mendukung Web Crypto di konteks ini. Coba buka file ini di Chrome.'}
};
$('copy').onclick=async()=>{const v=$('result').textContent;if(!v)return;try{await navigator.clipboard.writeText(v);$('status').textContent='Hash berhasil disalin.'}catch{$('status').textContent='Salin hasil secara manual.'}};
</script></body></html>
