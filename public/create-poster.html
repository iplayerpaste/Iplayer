<main class="shell create-shell"><a class="back-link" href="/">← Beranda</a><section class="panel create-panel"><span class="eyebrow muted">PUBLISH TO COMMUNITY</span><h1>Create Poster Link</h1><p>Isi detail poster dan tautan tujuan. Setelah diterbitkan, poster akan tampil di halaman Explore Poster Link.</p><form id="posterForm"><label>Judul poster<input id="posterTitle" maxlength="140" required placeholder="Contoh: Koleksi video terbaru"></label><label>Deskripsi<textarea id="posterDescription" rows="4" maxlength="2000" placeholder="Ceritakan isi poster..."></textarea></label><label>URL gambar poster<input id="posterImage" type="url" required placeholder="https://contoh.com/poster.jpg"></label><label>Link tujuan<input id="posterTarget" type="url" required placeholder="https://..." ></label><label>Nama pembuat <span>Opsional</span><input id="posterAuthor" maxlength="60" placeholder="Nama atau alias"></label><button class="button primary" id="publishPoster">Terbitkan Poster Link ↗</button><div id="posterStatus" class="status" aria-live="polite"></div></form><div id="posterResult" class="result-box hidden"></div></section></main><script src="/create-poster.js" type="module"></script>
